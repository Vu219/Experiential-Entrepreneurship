name: aima-scheduling-isolated
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: aima_isolated
      POSTGRES_USER: aima_isolated
      POSTGRES_PASSWORD: isolated-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - scheduling-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aima_isolated -d aima_isolated"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
volumes:
  scheduling-postgres:
